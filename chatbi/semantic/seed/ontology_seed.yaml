# ---------- NL→SemQL 种子问答对（few-shot 记忆） ----------
exemplars:
  - id: ex_region_net_sales
    dataset_id: ds_sales
    nl_question: 上个月各大区的净销售额
    semql_json:
      semql_version: '1.0'
      dataset: ds_sales
      metrics: [metric_net_sales]
      dimensions: [dim_region]
      time: {field: orders.order_date, range: last_month, grain: null}
      filters: []
      order_by: [{metric: metric_net_sales, direction: desc}]
      limit: 100
      compare: null
      query_mode: aggregate

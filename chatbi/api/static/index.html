<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightChat · 对话式 BI</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#fafaf9; --panel:#ffffff; --ink:#18181b; --ink2:#52525b; --ink3:#a1a1aa;
    --line:#ebebe8; --line2:#e4e4e0; --accent:#18181b; --blue:#2563eb; --green:#16a34a;
    --red:#dc2626; --amber:#b45309; --radius:16px;
    --shadow-s:0 1px 2px rgba(0,0,0,.04),0 1px 8px rgba(0,0,0,.03);
    --shadow-m:0 2px 6px rgba(0,0,0,.05),0 12px 32px -8px rgba(0,0,0,.10);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#dbeafe}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid #93c5fd;outline-offset:2px;border-radius:6px}

  /* ── 细滚动条 ─────────────────────────── */
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#d4d4d0;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#b8b8b2}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── 登录 ────────────────────────────── */
  #login-view{height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 70% -10%,#eef2ff 0%,transparent 55%),
               radial-gradient(900px 500px at 10% 110%,#ecfdf5 0%,transparent 55%),var(--bg)}
  .login-card{width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:40px 36px 32px;box-shadow:var(--shadow-m);animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
  .login-logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#18181b,#3f3f46);color:#fff;margin-bottom:18px}
  .login-card h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
  .login-card .sub{color:var(--ink3);font-size:13px;margin:4px 0 26px}
  .login-card label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
  .login-card input{width:100%;padding:11px 14px;margin-bottom:16px;font-size:14px;
    border:1px solid var(--line2);border-radius:10px;background:#fbfbfa;transition:border-color .2s,box-shadow .2s,background .2s}
  .login-card input:focus{outline:none;border-color:#a5b4fc;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.10)}
  .btn-primary{width:100%;padding:12px;font-size:14px;font-weight:550;letter-spacing:.06em;
    background:var(--accent);color:#fff;border-radius:10px;transition:transform .15s,box-shadow .2s,background .2s}
  .btn-primary:hover{background:#000;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}
  #login-err{color:var(--red);font-size:12px;margin-top:12px;min-height:16px;text-align:center}

  /* ── 主框架 ──────────────────────────── */
  #main-view{display:none;height:100vh;flex-direction:column}
  header{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    border-bottom:1px solid var(--line);background:rgba(250,250,249,.82);
    backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);z-index:30}
  .h-left,.h-right{display:flex;align-items:center;gap:10px}
  .icon-btn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--ink2);transition:background .18s,color .18s}
  .icon-btn:hover{background:#f0f0ee;color:var(--ink)}
  .brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650;letter-spacing:-.01em}
  .brand .b-logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#18181b,#3f3f46);
    color:#fff;display:flex;align-items:center;justify-content:center}
  .who-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);
    padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;background:#fff}
  .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#06b6d4);
    color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}

  #chat{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
  #messages{flex:1;overflow-y:auto;scroll-behavior:smooth}
  .col{max-width:840px;margin:0 auto;padding:0 24px}
  .msg>.col{flex:1;min-width:0}

  /* ── 空态 ────────────────────────────── */
  #empty{padding:11vh 24px 24px;text-align:center;animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
  #empty .e-logo{width:52px;height:52px;margin:0 auto 20px;border-radius:15px;color:#fff;
    background:linear-gradient(135deg,#18181b,#3f3f46);display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
  #empty h2{font-size:26px;font-weight:650;letter-spacing:-.02em}
  #empty p{color:var(--ink3);font-size:13.5px;margin-top:10px;line-height:1.8}

  /* ── 消息 ────────────────────────────── */
  .msg{padding:18px 0;animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
  .msg-user{display:flex;justify-content:flex-end}
  .msg-user .u-bubble{max-width:72%;background:var(--accent);color:#fafafa;font-size:14.5px;line-height:1.7;
    padding:11px 18px;border-radius:18px 18px 5px 18px;box-shadow:var(--shadow-s);white-space:pre-wrap;word-break:break-word}
  .msg-ai{display:flex;gap:14px}
  .ai-avatar{width:30px;height:30px;flex:none;margin-top:2px;border-radius:9px;color:#fff;
    background:linear-gradient(135deg,#18181b,#3f3f46);display:flex;align-items:center;justify-content:center}
  .ai-body{flex:1;min-width:0}

  /* ── 分析过程（留痕时间线） ────────────── */
  .trace{border:1px solid var(--line);border-radius:13px;background:#f5f5f3;margin-bottom:12px;overflow:hidden}
  .trace-head{width:100%;display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12.5px;
    color:var(--ink2);transition:background .18s;user-select:none}
  .trace-head:hover{background:#efefec}
  .trace-title{display:flex;align-items:center;gap:7px;font-weight:550;color:var(--ink)}
  .trace-meta{color:var(--ink3);font-variant-numeric:tabular-nums}
  .trace-head .chev{margin-left:auto;transition:transform .3s cubic-bezier(.22,1,.36,1);color:var(--ink3)}
  .trace.open .trace-head .chev{transform:rotate(180deg)}
  .spinner{width:13px;height:13px;flex:none;border-radius:50%;
    border:2px solid #d4d4d0;border-top-color:var(--ink);animation:spin .7s linear infinite}
  .trace-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1)}
  .trace:not(.open) .trace-body{grid-template-rows:0fr}
  .trace-inner{overflow:hidden;min-height:0}
  .steps{list-style:none;padding:2px 14px 4px}
  .step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;position:relative;animation:fadeUp .3s ease both}
  .step:not(:last-child)::before{content:'';position:absolute;left:7px;top:24px;bottom:-6px;width:1.5px;background:var(--line2)}
  .s-ico{width:15px;height:15px;flex:none;margin-top:2.5px;border-radius:50%;position:relative;z-index:1;
    display:flex;align-items:center;justify-content:center;background:#f5f5f3}
  .s-ico.doing::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
  .s-ico.done{background:var(--green);color:#fff}
  .s-ico.fail{background:var(--red);color:#fff}
  .s-main{flex:1;min-width:0}
  .s-label{font-size:12.5px;color:var(--ink);line-height:1.55}
  .step.is-doing .s-label{color:var(--blue)}
  .step.is-fail .s-label{color:var(--red)}
  .s-sub{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .s-time{flex:none;font-size:10.5px;color:#c6c6c1;font-variant-numeric:tabular-nums;margin-top:3px}
  .s-detail{margin-top:6px}
  details.s-detail,details.rec{border:1px solid var(--line2);border-radius:9px;background:#fff;overflow:hidden}
  details.s-detail summary,details.rec summary{list-style:none;display:flex;align-items:center;gap:6px;
    padding:6px 10px;font-size:11.5px;color:var(--ink2);cursor:pointer;user-select:none;transition:background .15s}
  details.s-detail summary:hover,details.rec summary:hover{background:#fafafa}
  details.s-detail summary::before,details.rec summary::before{content:'';width:0;height:0;
    border-left:4px solid var(--ink3);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;transition:transform .2s}
  details[open]>summary::before{transform:rotate(90deg)}
  details pre{padding:10px 12px;font-size:11px;line-height:1.65;color:#3f3f46;background:#fbfbfa;
    border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all;
    font-family:"SF Mono",SFMono-Regular,Consolas,"Cascadia Mono",monospace;max-height:260px;overflow:auto}
  .records{border-top:1px dashed var(--line2);margin-top:8px;padding:10px 14px 14px}
  .records .r-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink3);margin-bottom:8px}
  .records details.rec{margin-bottom:6px}
  .records .r-ver{font-size:11px;color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}

  /* ── 回答区 ──────────────────────────── */
  .thinking{display:inline-flex;align-items:center;gap:10px;color:var(--ink3);font-size:13.5px;padding:6px 0}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:5px;height:5px;border-radius:50%;background:#c6c6c1;animation:bounce 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  .summary{font-size:15px;line-height:1.85;color:#27272a;white-space:pre-wrap;word-break:break-word}
  .warn{display:flex;gap:8px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;color:var(--amber);
    border-radius:10px;padding:9px 13px;font-size:12.5px;line-height:1.6;margin-bottom:8px;animation:fadeUp .35s ease both}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-top:12px;box-shadow:var(--shadow-s);animation:fadeUp .45s ease both}
  .chart-box{width:100%;height:300px}
  .chart-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
  .chart-switch{display:flex;flex-wrap:wrap;gap:4px}
  .chart-switch button{font-size:11px;color:var(--ink3);padding:4px 9px;border-radius:7px;transition:background .16s,color .16s}
  .chart-switch button:hover{background:#f4f4f2;color:var(--ink)}
  .chart-switch button.active{background:#ededeb;color:var(--ink);font-weight:550}
  .chart-switch button:disabled{opacity:.45;cursor:wait}
  .chart-memory{font-size:11px;color:var(--green);line-height:1.6;text-align:right;max-width:330px}
  .chart-memory.error{color:var(--red)}
  .metric-card{text-align:center;padding:34px 16px}
  .metric-num{font-size:42px;font-weight:680;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .metric-label{color:var(--ink3);font-size:12.5px;margin-top:6px}
  table.tbl{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tbl th{color:var(--ink3);font-weight:550;text-align:right;padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl td{padding:8px 12px;text-align:right;border-bottom:1px solid #f3f3f1;color:#3f3f46}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr{transition:background .12s}
  .tbl tbody tr:hover{background:#fafaf9}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{background:#f4f4f2;color:var(--ink2);border:1px solid var(--line);border-radius:99px;
    font-size:11px;padding:2.5px 10px;line-height:1.5}
  .rules{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.8;
    border-left:2px solid var(--line2);padding-left:10px}
  .events-line{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.8;
    background:#f5f5f3;border-radius:9px;padding:8px 12px}
  .feedback{display:flex;align-items:center;gap:4px;margin-top:12px}
  .feedback .fb-label{font-size:11.5px;color:var(--ink3);margin-right:4px}
  .fb-btn{width:28px;height:28px;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;
    color:var(--ink3);transition:background .15s,color .15s,transform .15s}
  .fb-btn:hover{background:#f0f0ee;color:var(--ink);transform:scale(1.08)}
  .fb-done{font-size:12px;color:var(--green)}
  .fb-err{font-size:12px;color:var(--red)}
  .err-card{display:flex;gap:9px;align-items:flex-start;background:#fef2f2;border:1px solid #fecaca;
    color:var(--red);border-radius:12px;padding:11px 15px;font-size:13px;line-height:1.6}

  /* ── 澄清选项 ────────────────────────── */
  .clarify-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .clarify-opts button{text-align:left;padding:11px 15px;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line2);border-radius:12px;background:#fff;
    transition:border-color .18s,box-shadow .18s,transform .18s}
  .clarify-opts button:hover{border-color:#a5b4fc;box-shadow:0 4px 14px -6px rgba(99,102,241,.35);transform:translateY(-1px)}

  /* ── 示例 chips + 输入区 ───────────────── */
  #composer{flex:none;padding:6px 24px 14px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
  .composer-col{max-width:840px;margin:0 auto}
  #chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line2);
    border-radius:99px;padding:5.5px 13px;white-space:nowrap;
    transition:color .18s,border-color .18s,transform .18s,box-shadow .18s}
  .chip:hover{color:var(--ink);border-color:#c7c7c2;transform:translateY(-1px);box-shadow:var(--shadow-s)}
  .chip:active{transform:translateY(0)}
  .input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--panel);
    border:1px solid var(--line2);border-radius:22px;padding:10px 10px 10px 20px;box-shadow:var(--shadow-m);
    transition:border-color .2s,box-shadow .2s}
  .input-wrap:focus-within{border-color:#c7d2fe;box-shadow:0 0 0 4px rgba(99,102,241,.09),var(--shadow-m)}
  #q{flex:1;border:none;outline:none;resize:none;font-size:14.5px;line-height:1.6;
    max-height:168px;background:transparent;padding:4px 0}
  #q::placeholder{color:#c6c6c1}
  #send-btn{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;transition:background .18s,transform .15s,opacity .18s}
  #send-btn:hover:not(:disabled){background:#000;transform:scale(1.06)}
  #send-btn:active:not(:disabled){transform:scale(.96)}
  #send-btn:disabled{opacity:.28;cursor:default}
  .composer-hint{text-align:center;font-size:11px;color:#c6c6c1;margin-top:9px}

  /* ── 历史会话抽屉 ─────────────────────── */
  #drawer-mask{position:fixed;inset:0;background:rgba(24,24,27,.28);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
  #drawer-mask.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:292px;background:var(--panel);z-index:41;
    box-shadow:var(--shadow-m);transform:translateX(-105%);transition:transform .38s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;padding:18px 14px 14px}
  #drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 14px;
    font-size:14px;font-weight:650}
  #new-session{width:100%;padding:10px;font-size:13px;font-weight:550;color:var(--ink);
    border:1.5px dashed #d4d4d0;border-radius:11px;margin-bottom:12px;transition:border-color .18s,background .18s}
  #new-session:hover{border-color:var(--ink);background:#fafaf9}
  #slist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .sitem{padding:9px 12px;border-radius:10px;font-size:13px;color:var(--ink2);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
  .sitem:hover{background:#f4f4f2;color:var(--ink)}
  .sitem.active{background:#f0f0ee;color:var(--ink);font-weight:550}
  .s-empty{font-size:12px;color:var(--ink3);text-align:center;padding:24px 0}

  /* ── 用户记忆 ────────────────────────── */
  #memory-mask{position:fixed;inset:0;background:rgba(24,24,27,.24);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  #memory-mask.open{opacity:1;pointer-events:auto}
  #memory-panel{position:fixed;left:50%;top:50%;width:560px;max-width:calc(100vw - 32px);max-height:min(720px,calc(100vh - 48px));
    display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 24px 80px -20px rgba(0,0,0,.22);z-index:51;opacity:0;pointer-events:none;
    transform:translate(-50%,-47%) scale(.98);transition:opacity .25s,transform .32s cubic-bezier(.22,1,.36,1)}
  #memory-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .memory-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 12px}
  .memory-head h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .memory-sub{padding:0 22px 14px;color:var(--ink3);font-size:12px;line-height:1.7;border-bottom:1px solid var(--line)}
  #memory-list{overflow-y:auto;padding:12px 16px;min-height:120px}
  .memory-item{display:flex;align-items:flex-start;gap:12px;padding:13px 8px;border-bottom:1px solid #f2f2ef;animation:fadeUp .25s ease both}
  .memory-item:last-child{border-bottom:none}
  .memory-item-main{flex:1;min-width:0}
  .memory-item-title{font-size:13px;color:var(--ink);line-height:1.55;word-break:break-word}
  .memory-item-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:10.5px;color:var(--ink3)}
  .memory-pill{background:#f5f5f3;border-radius:99px;padding:2px 7px}
  .memory-pill.decayed{color:var(--amber);background:#fffbeb}
  .memory-delete{flex:none;width:27px;height:27px;border-radius:7px;color:var(--ink3);display:flex;align-items:center;justify-content:center}
  .memory-delete:hover{background:#fef2f2;color:var(--red)}
  .memory-state{text-align:center;color:var(--ink3);font-size:12.5px;padding:36px 14px;line-height:1.8}
  .memory-state.error{color:var(--red)}
  .memory-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 22px;border-top:1px solid var(--line)}
  .memory-foot-note{font-size:11px;color:var(--ink3)}
  .memory-clear{font-size:12px;color:var(--red);padding:6px 9px;border-radius:8px;transition:background .15s}
  .memory-clear:hover{background:#fef2f2}

  /* ── 动效 ────────────────────────────── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

  @media (max-width:640px){
    .msg-user .u-bubble{max-width:88%}
    #empty h2{font-size:21px}
    .who-chip .who-name{display:none}
  }
</style>
</head>
<body>

<!-- ═══ 登录 ═══ -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo" id="login-logo"></div>
    <h1>InsightChat</h1>
    <p class="sub">企业级对话式 BI · 本地演示</p>
    <label for="u">用户名</label>
    <input id="u" value="analyst" placeholder="用户名" autocomplete="username">
    <label for="p">密码</label>
    <input id="p" type="password" value="Init@123456" placeholder="密码" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">登 录</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ═══ 主界面 ═══ -->
<div id="main-view">
  <header>
    <div class="h-left">
      <button class="icon-btn" id="history-btn" title="历史会话"></button>
      <span class="brand"><span class="b-logo" id="brand-logo"></span>InsightChat</span>
    </div>
    <div class="h-right">
      <button class="icon-btn" id="memory-btn" title="我的记忆"></button>
      <span class="who-chip"><span class="avatar" id="who-avatar"></span><span class="who-name" id="who"></span></span>
      <button class="icon-btn" id="logout-btn" title="退出登录"></button>
    </div>
  </header>

  <main id="chat">
    <div id="messages"></div>

    <div id="composer">
      <div class="composer-col">
        <div id="chips"></div>
        <div class="input-wrap">
          <textarea id="q" rows="1" placeholder="用自然语言提问，例如：2024年4月各大区的净销售额"></textarea>
          <button id="send-btn" title="发送" disabled></button>
        </div>
        <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 内容由 AI 生成，关键数据请核验留痕信息</div>
      </div>
    </div>
  </main>

  <div id="drawer-mask"></div>
  <aside id="drawer">
    <div class="drawer-head">历史会话 <button class="icon-btn" id="drawer-close"></button></div>
    <button id="new-session">＋ 新会话</button>
    <div id="slist"></div>
  </aside>

  <div id="memory-mask"></div>
  <section id="memory-panel" role="dialog" aria-modal="true" aria-labelledby="memory-title">
    <div class="memory-head"><h2 id="memory-title">我的记忆</h2><button class="icon-btn" id="memory-close"></button></div>
    <div class="memory-sub">只保存您的图表偏好、指标口径和已确认问答。对话中说「忘掉全部记忆」可随时清除。</div>
    <div id="memory-list"><div class="memory-state">正在读取…</div></div>
    <div class="memory-foot"><span class="memory-foot-note">记忆仅本人可见 · 失效记录保留审计</span><button class="memory-clear" id="memory-clear">清空长期记忆</button></div>
  </section>
</div>

<script>
/* ═══════════════ 基础 ═══════════════ */
const API = '/api/v1';
let token = localStorage.getItem('ic_token') || '';
let me = JSON.parse(localStorage.getItem('ic_user') || 'null');
let sessionId = null;
let asking = false;
const charts = [];
const echartsOK = () => typeof echarts !== 'undefined';

const EXAMPLES = [
  '2024年4月各大区的净销售额',
  '为什么2024年4月的销量比5月低',
  '今年上半年各品类的毛利率趋势',
  '销售额 Top10 的商品',
  '华东区各月的客单价变化',
];

const PALETTE = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#84cc16','#f97316'];
const CHART_LABELS = {line:'折线图',multi_line:'多系列折线',bar:'柱状图',bar_horizontal:'条形图',top10_bar_horizontal:'Top10条形',pie:'饼图',treemap:'矩形树图',metric_card:'指标卡',table:'表格',pivot_table:'透视表',waterfall:'瀑布图'};

const ICON = {
  spark:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.1 6.5L21 10l-6.9 1.5L12 18l-2.1-6.5L3 10l6.9-1.5L12 2z" fill="currentColor"/><path d="M19 15l.9 2.6L22.5 18.5l-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9L19 15z" fill="currentColor" opacity=".65"/></svg>',
  clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
  memory:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/><circle cx="12" cy="12" r="2"/></svg>',
  close:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  logout:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
  send:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  chev:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  cross:'<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  warn:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
};

const $ = s => document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(v){ if(v==null) return '-'; if(typeof v==='number') return Number.isInteger(v)? v.toLocaleString() : v.toLocaleString(undefined,{maximumFractionDigits:2}); return esc(v); }
function scrollBottom(){ const m=$('#messages'); m.scrollTop = m.scrollHeight; }

async function api(path, opts={}, raw=false){
  opts.headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token}, opts.headers||{});
  const r = await fetch(API+path, opts);
  if(raw) return r;
  const j = await r.json();
  if(j.code !== 0) throw new Error(j.message || ('错误 '+j.code));
  return j.data;
}

/* ═══════════════ 登录 / 会话 ═══════════════ */
async function doLogin(){
  try {
    const d = await api('/auth/login', {method:'POST', body: JSON.stringify({username:$('#u').value, password:$('#p').value})});
    token = d.token; me = d.user;
    localStorage.setItem('ic_token', token); localStorage.setItem('ic_user', JSON.stringify(me));
    enterMain();
  } catch(e){ $('#login-err').textContent = e.message; }
}

function enterMain(){
  $('#login-view').style.display='none';
  $('#main-view').style.display='flex';
  const name = me.display_name || me.username || '';
  $('#who').textContent = name + '（' + (me.roles||[]).join('/') + '）';
  $('#who-avatar').textContent = (name||'U').slice(0,1).toUpperCase();
  renderEmpty();
  loadSessions();
  $('#q').focus();
}

function doLogout(){
  localStorage.removeItem('ic_token'); localStorage.removeItem('ic_user');
  location.reload();
}

async function loadSessions(){
  try {
    const d = await api('/history/sessions?limit=30');
    const el = $('#slist');
    el.innerHTML = '';
    if(!d.items || !d.items.length){ el.innerHTML = '<div class="s-empty">暂无历史会话</div>'; return; }
    d.items.forEach(s => {
      const div = document.createElement('div');
      div.className = 'sitem' + (s.id===sessionId?' active':'');
      div.textContent = (s.title||'会话').slice(0,24);
      div.onclick = ()=>{ sessionId=s.id; clearMessages(); closeDrawer(); loadSessions(); $('#q').focus(); };
      el.appendChild(div);
    });
  } catch(e){ /* 列表失败不打扰主流程 */ }
}

function newSession(){ sessionId=null; clearMessages(); closeDrawer(); loadSessions(); $('#q').focus(); }

function openDrawer(){ $('#drawer').classList.add('open'); $('#drawer-mask').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer-mask').classList.remove('open'); }

/* ═══════════════ 用户记忆管理 ═══════════════ */
const MEMORY_SOURCE = {explicit:'明确指定',chart_switch:'切图学习',clarify:'澄清学习',feedback:'点赞确认'};
function openMemory(){ closeDrawer(); $('#memory-panel').classList.add('open'); $('#memory-mask').classList.add('open'); loadMemories(); }
function closeMemory(){ $('#memory-panel').classList.remove('open'); $('#memory-mask').classList.remove('open'); }

function memoryItemTitle(item){
  if(item.category==='chart_preference') return (item.family_name||'图表')+' → '+(item.chart_name||item.value.chart_type);
  if(item.category==='term_mapping') return '「'+item.memory_key+'」→「'+(item.value.term_id||'-')+'」';
  if(item.category==='query_exemplar') return '已确认问答：'+String(item.value.nl_question||'').slice(0,90);
  return item.memory_key;
}

async function loadMemories(){
  const box = $('#memory-list');
  box.innerHTML = '<div class="memory-state">正在读取…</div>';
  try {
    const d = await api('/memories');
    const items = d.items || [];
    $('#memory-clear').disabled = !items.length;
    if(!items.length){ box.innerHTML = '<div class="memory-state">还没有长期记忆。<br>试试对他说「以后趋势都用折线图」。</div>'; return; }
    box.innerHTML = items.map(item => {
      const state = item.status==='candidate' ? '待跨会话确认' : (item.decayed ? '已衰减 · 不生效' : '生效中');
      const pct = Math.round((item.effective_confidence||0)*100);
      return '<div class="memory-item"><div class="memory-item-main">' +
        '<div class="memory-item-title">'+esc(memoryItemTitle(item))+'</div>' +
        '<div class="memory-item-meta"><span class="memory-pill">'+esc(MEMORY_SOURCE[item.source]||item.source)+'</span>' +
        '<span class="memory-pill '+(item.decayed?'decayed':'')+'">'+esc(state)+'</span>' +
        '<span class="memory-pill">有效置信度 '+pct+'%</span><span>使用 '+(item.access_count||0)+' 次</span></div></div>' +
        '<button class="memory-delete" data-id="'+esc(item.id)+'" title="忘掉这条">'+ICON.cross+'</button></div>';
    }).join('');
    box.querySelectorAll('.memory-delete').forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      try { await api('/memories/'+encodeURIComponent(btn.dataset.id), {method:'DELETE'}); await loadMemories(); }
      catch(e){ btn.disabled = false; alert(e.message); }
    });
  } catch(e){
    $('#memory-clear').disabled = true;
    box.innerHTML = '<div class="memory-state error">读取失败：'+esc(e.message)+'<br><button onclick="loadMemories()" style="margin-top:8px;text-decoration:underline">重试</button></div>';
  }
}

async function clearMemories(){
  if(!window.confirm('确定清空全部长期记忆吗？历史消息与审计记录会保留。')) return;
  try { await api('/memories', {method:'DELETE'}); await loadMemories(); }
  catch(e){ alert(e.message); }
}

/* ═══════════════ 消息骨架 ═══════════════ */
function clearMessages(){ $('#messages').innerHTML=''; renderEmpty(); }

function renderEmpty(){
  const m = $('#messages');
  if(m.children.length) return;
  const name = (me && (me.display_name||me.username)) || '';
  m.innerHTML =
    '<div id="empty"><div class="e-logo">'+ICON.spark+'</div>' +
    '<h2>' + (name ? '你好，'+esc(name)+'。' : '你好。') + '今天想分析什么？</h2>' +
    '<p>用自然语言提问，InsightChat 会自动完成意图识别、语义匹配、SQL 生成与图表推荐。<br>点击下方示例快速开始，分析过程将逐步留痕、可随时展开核验。</p></div>';
}

function removeEmpty(){ const e=$('#empty'); if(e) e.remove(); }

function addUserMsg(text){
  removeEmpty();
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = '<div class="col" style="display:flex;justify-content:flex-end"><div class="u-bubble">'+esc(text)+'</div></div>';
  $('#messages').appendChild(div);
  scrollBottom();
}

/* 助手消息 = 头像 + (分析过程卡 + 回答区) */
function addAssistantMsg(){
  removeEmpty();
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML =
    '<div class="col" style="display:flex;gap:14px">' +
      '<div class="ai-avatar">'+ICON.spark+'</div>' +
      '<div class="ai-body"><div class="answer"><span class="thinking"><span class="dots"><i></i><i></i><i></i></span>正在理解您的问题…</span></div></div>' +
    '</div>';
  $('#messages').appendChild(div);
  scrollBottom();
  return { root: div, answer: div.querySelector('.answer'), trace: null };
}

/* ── 分析过程时间线 ── */
function ensureTrace(msg){
  if(msg.trace) return msg.trace;
  const el = document.createElement('div');
  el.className = 'trace open';
  el.innerHTML =
    '<button class="trace-head">' +
      '<span class="spinner"></span>' +
      '<span class="trace-title">分析过程</span>' +
      '<span class="trace-meta">进行中…</span>' +
      '<span class="chev">'+ICON.chev+'</span>' +
    '</button>' +
    '<div class="trace-body"><div class="trace-inner"><ol class="steps"></ol></div></div>';
  msg.answer.before(el);
  el.querySelector('.trace-head').onclick = () => el.classList.toggle('open');
  msg.trace = { el, stepsEl: el.querySelector('.steps'), metaEl: el.querySelector('.trace-meta'),
                spinEl: el.querySelector('.spinner'), t0: performance.now(), n: 0, last: null };
  return msg.trace;
}

function addStep(msg, label, sub, detailHTML){
  const tr = ensureTrace(msg);
  if(tr.last){ finishStepIcon(tr.last, 'done'); tr.last.classList.remove('is-doing'); }
  tr.n += 1;
  const li = document.createElement('li');
  li.className = 'step is-doing';
  const dt = ((performance.now() - tr.t0)/1000).toFixed(1);
  li.innerHTML =
    '<span class="s-ico doing"></span>' +
    '<div class="s-main"><div class="s-label">'+esc(label)+'</div>' +
      (sub ? '<div class="s-sub">'+esc(sub)+'</div>' : '') +
      (detailHTML || '') +
    '</div>' +
    '<span class="s-time">+'+dt+'s</span>';
  tr.stepsEl.appendChild(li);
  tr.last = li;
  tr.metaEl.textContent = '第 '+tr.n+' 步进行中…';
  scrollBottom();
}

function finishStepIcon(li, kind){
  const ico = li.querySelector('.s-ico');
  ico.className = 's-ico ' + kind;
  ico.innerHTML = kind==='done' ? ICON.check : ICON.cross;
}

function finishTrace(msg, ok){
  const tr = msg.trace; if(!tr) return;
  if(tr.last){ finishStepIcon(tr.last, ok?'done':'fail'); tr.last.classList.remove('is-doing'); if(!ok) tr.last.classList.add('is-fail'); }
  const secs = ((performance.now() - tr.t0)/1000).toFixed(1);
  tr.spinEl.outerHTML = '<span class="s-ico '+(ok?'done':'fail')+'" style="width:15px;height:15px">'+(ok?ICON.check:ICON.cross)+'</span>';
  tr.metaEl.textContent = tr.n + ' 步 · ' + secs + 's';
  setTimeout(()=>{ tr.el.classList.remove('open'); }, 650);
}

/* 结果留痕：SQL / SemQL / 匹配解释 / 规则 / 语义版本 */
function addRecords(msg, d){
  const tr = msg.trace; if(!tr || !d) return;
  let blocks = '';
  if(d.sql) blocks += '<details class="rec"><summary>SQL</summary><pre>'+esc(d.sql)+'</pre></details>';
  if(d.semql) blocks += '<details class="rec"><summary>SemQL</summary><pre>'+esc(JSON.stringify(d.semql,null,1))+'</pre></details>';
  if(d.match_explain && d.match_explain.length) blocks += '<details class="rec"><summary>匹配解释</summary><pre>'+esc(d.match_explain.join('\n'))+'</pre></details>';
  if(d.applied_rules && d.applied_rules.length) blocks += '<details class="rec"><summary>已应用规则</summary><pre>'+esc(d.applied_rules.join('\n'))+'</pre></details>';
  if(d.memory_trace && d.memory_trace.length) blocks += '<details class="rec"><summary>记忆使用</summary><pre>'+esc(d.memory_trace.join('\n'))+'</pre></details>';
  const ver = d.semantic_version!=null ? '语义版本 v' + d.semantic_version : '用户记忆 · 仅本人可见';
  if(!blocks && d.semantic_version==null) return;
  const rec = document.createElement('div');
  rec.className = 'records';
  rec.innerHTML = '<div class="r-title">留痕核验</div>' + blocks + '<div class="r-ver">'+esc(ver)+'</div>';
  tr.el.querySelector('.trace-inner').appendChild(rec);
}

function updateMemoryRecords(msg, d){
  const tr = msg.trace; if(!tr) return;
  const rec = tr.el.querySelector('.records');
  if(!rec){ addRecords(msg, d); return; }
  const old = [...rec.querySelectorAll('details.rec')].find(x=>x.querySelector('summary').textContent==='记忆使用');
  if(old) old.remove();
  if(d.memory_trace && d.memory_trace.length){
    const detail = document.createElement('details'); detail.className='rec';
    detail.innerHTML = '<summary>记忆使用</summary><pre>'+esc(d.memory_trace.join('\n'))+'</pre>';
    rec.insertBefore(detail, rec.querySelector('.r-ver'));
  }
}

/* ═══════════════ 提问主流程 ═══════════════ */
async function doAsk(text){
  const q = (text !== undefined ? text : $('#q').value).trim();
  if(!q || asking) return;
  asking = true; updateSendBtn();
  $('#q').value=''; autosize();
  addUserMsg(q);
  const msg = addAssistantMsg();
  try {
    await ssePost('/chat/ask', {question:q, session_id:sessionId}, (evt, data) => {
      if(evt==='intent'){
        sessionId = data.session_id || sessionId;
        msg.answer.innerHTML = '';
        addStep(msg, '意图识别', '识别为 ' + (data.intent||'-'),
          '<details class="s-detail"><summary>意图详情</summary><pre>'+esc(JSON.stringify(data,null,1))+'</pre></details>');
      }
      else if(evt==='progress'){ addStep(msg, data.note || data.stage || '处理中'); }
      else if(evt==='clarify'){ finishTrace(msg, true); renderClarify(msg, data); }
      else if(evt==='result'){ addStep(msg, '生成结果', (data.row_count!=null ? '返回 '+data.row_count+' 行' : null)); finishTrace(msg, true); addRecords(msg, data); renderResult(msg, data); loadSessions(); }
      else if(evt==='error'){ failAsk(msg, data.message||'出错啦'); }
    });
  } catch(e){ failAsk(msg, e.message); }
  asking = false; updateSendBtn();
}

function failAsk(msg, text){
  if(msg.trace) finishTrace(msg, false);
  msg.answer.innerHTML = '<div class="err-card">'+ICON.warn+'<span>'+esc(text)+'</span></div>';
  scrollBottom();
}

function renderClarify(msg, card){
  let h = '<div class="summary">'+esc(card.prompt)+'</div><div class="clarify-opts">';
  card.options.forEach(o => { h += '<button data-key="'+esc(o.key)+'">'+esc(o.label)+'</button>'; });
  h += '</div>';
  msg.answer.innerHTML = h;
  msg.answer.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      msg.answer.querySelectorAll('button').forEach(b=>b.disabled=true);
      const nm = addAssistantMsg();
      try {
        await ssePost('/chat/clarify', {clarify_id: card.clarify_id, selected_key: btn.dataset.key}, (evt,data)=>{
          if(evt==='progress') addStep(nm, data.note||data.stage||'处理中');
          else if(evt==='result'){ addStep(nm,'生成结果', (data.row_count!=null?'返回 '+data.row_count+' 行':null)); finishTrace(nm,true); addRecords(nm,data); renderResult(nm,data); }
          else if(evt==='error') failAsk(nm, data.message);
        });
      } catch(e){ failAsk(nm, e.message); }
    };
  });
  scrollBottom();
}

/* ═══════════════ 结果渲染 ═══════════════ */
function renderResult(msg, d){
  let h = '';
  (d.assumptions||[]).forEach(a => { h += '<div class="warn">'+ICON.warn+'<span>'+esc(a)+'</span></div>'; });
  if(d.answer_type==='insight'){
    h += '<div class="summary">'+esc(d.narrative||d.summary||'')+'</div>';
    const r = d.report||{};
    if(r.waterfall && r.waterfall.length){ h += '<div class="chart-card"><div class="chart-host"></div></div>'; }
    if(r.events && r.events.length){
      h += '<div class="events-line">时间重合事件：' + r.events.map(e=>esc(e.name)+'（'+esc(e.start_date)+' ~ '+esc(e.end_date)+'）').join('；') + '</div>';
    }
  } else if(d.answer_type==='data'){
    if(d.summary) h += '<div class="summary">'+esc(d.summary)+'</div>';
    const types = [...new Set((d.chart.available_types||[d.chart.type]).filter(Boolean))];
    h += '<div class="chart-card"><div class="chart-toolbar"><div class="chart-switch">' +
      types.map(t=>'<button data-chart="'+esc(t)+'" class="'+(t===d.chart.type?'active':'')+'" aria-pressed="'+(t===d.chart.type)+'">'+esc(CHART_LABELS[t]||t)+'</button>').join('') +
      '</div><div class="chart-memory"></div></div><div class="chart-host"></div></div>';
    if((d.match_explain||[]).length) h += '<div class="tags">'+d.match_explain.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>';
    if(d.applied_rules && d.applied_rules.length) h += '<div class="rules">'+d.applied_rules.map(esc).join('<br>')+'</div>';
    h += '<div class="feedback"><span class="fb-label">这个回答有帮助吗？</span><button class="fb-btn" data-v="up" title="有帮助">👍</button><button class="fb-btn" data-v="down" title="不准确">👎</button></div>';
  } else {
    h += '<div class="summary">'+esc(d.summary||'')+'</div>';
  }
  msg.answer.innerHTML = h;
  const host = msg.answer.querySelector('.chart-host');
  if(host){
    if(d.answer_type==='insight'){ const wf=d.report.waterfall.map(x=>[x.label,x.value,x.type]); renderChart(host, {type:'waterfall'}, ['label','value','type'], wf, null); }
    else { renderChart(host, d.chart, d.columns, d.rows, d.columns_meta); bindChartSwitch(msg, d); }
  }
  const fb = msg.answer.querySelector('.feedback');
  if(fb && d.answer_id){ fb.querySelectorAll('button').forEach(b => b.onclick = async () => {
    try{ await api('/feedback',{method:'POST',body:JSON.stringify({answer_id:d.answer_id, vote:b.dataset.v, reason_tag: b.dataset.v==='down'?'other':null})}); fb.innerHTML='<span class="fb-done">已收到，感谢反馈</span>'; }
    catch(e){ fb.innerHTML='<span class="fb-err">'+esc(e.message)+'</span>'; }
  }); }
  scrollBottom();
}

function bindChartSwitch(msg, d){
  const card = msg.answer.querySelector('.chart-card');
  if(!card) return;
  const buttons = [...card.querySelectorAll('[data-chart]')];
  buttons.forEach(btn => btn.onclick = async () => {
    const target = btn.dataset.chart;
    if(target===d.chart.type || btn.disabled) return;
    const note = card.querySelector('.chart-memory');
    buttons.forEach(b=>b.disabled=true);
    note.className = 'chart-memory'; note.textContent = '正在切换…';
    try {
      const res = await api('/memories/chart-switch', {method:'POST', body:JSON.stringify({answer_id:d.answer_id, chart_type:target, session_id:sessionId})});
      d.chart = res.chart;
      d.memory_trace = (d.memory_trace||[]).concat(res.memory_trace||[]);
      updateMemoryRecords(msg, d);
      const host = card.querySelector('.chart-host');
      renderChart(host, d.chart, d.columns, d.rows, d.columns_meta);
      buttons.forEach(b=>{ const active=b.dataset.chart===d.chart.type; b.classList.toggle('active',active); b.setAttribute('aria-pressed',active); });
      note.textContent = (res.memory_trace||[])[0] || '已记住图表偏好';
    } catch(e){ note.className='chart-memory error'; note.textContent=e.message; }
    finally { buttons.forEach(b=>b.disabled=false); }
  });
}

function renderTable(cols, rows){
  let h = '<table class="tbl"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{ h += '<tr>'+r.map(v=>'<td>'+fmt(v)+'</td>').join('')+'</tr>'; });
  return h+'</tbody></table>';
}

const AXIS_STYLE = {
  axisLine:{lineStyle:{color:'#e4e4e0'}}, axisTick:{show:false},
  axisLabel:{color:'#a1a1aa',fontSize:11}, splitLine:{lineStyle:{color:'#f3f3f1'}},
};

function disposeChart(container){
  if(container && container._chart){
    const old = container._chart;
    try{old.dispose();}catch(e){}
    const index = charts.indexOf(old); if(index>=0) charts.splice(index,1);
    container._chart=null;
  }
}

function renderChart(container, chart, cols, rows, colsMeta){
  disposeChart(container);
  container.innerHTML = '';
  const t = chart && chart.type;
  if(!echartsOK() || !t || t==='table' || t==='pivot_table'){
    container.innerHTML = '<div style="overflow-x:auto">'+renderTable(cols, rows)+'</div>'; return;
  }
  const box = document.createElement('div'); box.className='chart-box';
  container.appendChild(box);
  const ch = echarts.init(box);
  container._chart = ch;
  charts.push(ch);
  const dimIdx = (colsMeta||[]).findIndex(c=>c.role==='dimension');
  const timeIdx = (colsMeta||[]).findIndex(c=>c.role==='time');
  const metIdx = (colsMeta||[]).findIndex(c=>c.role==='metric');
  const catIdx = dimIdx>=0?dimIdx:(timeIdx>=0?timeIdx:0);
  const valIdx = metIdx>=0?metIdx:cols.length-1;
  const catAxis = Object.assign({type:'category'}, AXIS_STYLE);
  const valAxis = Object.assign({type:'value'}, AXIS_STYLE);
  try {
    if(t==='metric_card'){
      container.innerHTML = '<div class="metric-card"><div class="metric-num">'+fmt(rows[0][valIdx])+'</div><div class="metric-label">'+esc(cols[valIdx])+'</div></div>';
      disposeChart(container); return;
    }
    if(t==='bar'||t==='bar_horizontal'||t==='top10_bar_horizontal'){
      const cats = rows.map(r=>String(r[catIdx])), vals = rows.map(r=>r[valIdx]);
      const horizontal = t!=='bar';
      const opt = horizontal
        ? {xAxis:valAxis, yAxis:Object.assign({data:cats},catAxis), series:[{type:'bar',data:vals,barMaxWidth:22,itemStyle:{borderRadius:[0,6,6,0]}}]}
        : {xAxis:Object.assign({data:cats},catAxis), yAxis:valAxis, series:[{type:'bar',data:vals,barMaxWidth:30,itemStyle:{borderRadius:[6,6,0,0]}}]};
      opt.color=PALETTE; opt.grid={containLabel:true,left:8,right:16,top:16,bottom:0}; opt.tooltip={};
      ch.setOption(opt); return;
    }
    if(t==='line'){
      ch.setOption({color:PALETTE, xAxis:Object.assign({data:rows.map(r=>String(r[catIdx]))},catAxis), yAxis:valAxis,
        series:[{type:'line',data:rows.map(r=>r[valIdx]),smooth:true,symbolSize:6,lineStyle:{width:2.5},areaStyle:{opacity:.06}}],
        grid:{containLabel:true,left:8,right:16,top:16,bottom:0}, tooltip:{trigger:'axis'}}); return;
    }
    if(t==='multi_line'){
      const times=[...new Set(rows.map(r=>String(r[timeIdx>=0?timeIdx:0])))].sort();
      const cats=[...new Set(rows.map(r=>String(r[dimIdx>=0?dimIdx:1])))];
      const series=cats.map(c=>({name:c,type:'line',smooth:true,symbolSize:5,lineStyle:{width:2.5},data:times.map(tm=>{const row=rows.find(r=>String(r[timeIdx>=0?timeIdx:0])===tm&&String(r[dimIdx>=0?dimIdx:1])===c);return row?row[valIdx]:null;})}));
      ch.setOption({color:PALETTE, xAxis:Object.assign({data:times},catAxis), yAxis:valAxis, series,
        legend:{textStyle:{color:'#71717a',fontSize:11},top:0}, grid:{containLabel:true,left:8,right:16,top:30,bottom:0}, tooltip:{trigger:'axis'}}); return;
    }
    if(t==='pie'){
      ch.setOption({color:PALETTE, series:[{type:'pie',radius:['42%','68%'],itemStyle:{borderRadius:6,borderColor:'#fff',borderWidth:2},
        data:rows.map(r=>({name:String(r[catIdx]),value:r[valIdx]})),label:{formatter:'{b}: {d}%',color:'#71717a',fontSize:11}}],tooltip:{}}); return;
    }
    if(t==='waterfall'){
      const labels=rows.map(r=>r[0]), vals=rows.map(r=>r[1]), types=rows.map(r=>r[2]);
      let run=0; const base=[],delta=[],colors=[];
      vals.forEach((v,i)=>{
        if(types[i]==='base'){base.push(0);delta.push(v);run=v;colors.push('#94a3b8');}
        else if(types[i]==='total'){base.push(0);delta.push(v);colors.push('#525252');}
        else { if(v>=0){base.push(run);delta.push(v);run+=v;colors.push('#16a34a');} else {base.push(run+v);delta.push(-v);run+=v;colors.push('#dc2626');} }
      });
      ch.setOption({xAxis:Object.assign({data:labels},catAxis),yAxis:valAxis,
        series:[{type:'bar',stack:'w',itemStyle:{color:'transparent'},data:base,tooltip:{show:false}},
                {type:'bar',stack:'w',data:delta,barMaxWidth:34,itemStyle:{color:p=>colors[p.dataIndex],borderRadius:5}}],
        grid:{containLabel:true,left:8,right:16,top:16,bottom:0},tooltip:{}}); return;
    }
    disposeChart(container);
    container.innerHTML = '<div style="overflow-x:auto">'+renderTable(cols, rows)+'</div>';
  } catch(e){ disposeChart(container); container.innerHTML = '<div style="overflow-x:auto">'+renderTable(cols, rows)+'</div>'; }
}

/* ═══════════════ SSE（LF 归一化，勿删） ═══════════════ */
async function ssePost(path, body, onEvent){
  const r = await api(path, {method:'POST', body: JSON.stringify(body)}, true);
  if(!r.ok){ const j = await r.json().catch(()=>null); throw new Error(j?.message || ('HTTP '+r.status)); }
  const reader = r.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '';
  const handle = chunk => {
    let evt='message', data='';
    chunk.split('\n').forEach(line=>{
      if(line.startsWith('event:')) evt=line.slice(6).trim();
      else if(line.startsWith('data:')) data+=line.slice(5).trim();
    });
    if(data){ try{ onEvent(evt, JSON.parse(data)); }catch(e){ onEvent(evt, {message:data}); } }
  };
  while(true){
    const {done, value} = await reader.read();
    if(value){ buf += dec.decode(value, {stream:true}); buf = buf.replace(/\r\n/g, '\n'); }
    let idx;
    while((idx = buf.indexOf('\n\n')) >= 0){ const chunk = buf.slice(0, idx); buf = buf.slice(idx+2); handle(chunk); }
    if(done){ buf = buf.trim(); if(buf) handle(buf); break; }
  }
}
